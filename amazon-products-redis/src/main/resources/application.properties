spring.application.name=amazon-products-redis
server.port=8080

# 1. Primary Persistent Database Layer: Local MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/kodewala
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Auto-Schema Migration Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 2. In-Memory Caching Layer: Upstash Serverless Redis Configuration
# Replace with the clean endpoint address string from your Upstash console (omit "redis://" prefix)
spring.data.redis.host=wired-piranha-171420.upstash.io
# Replace with the specific numerical port assigned by Upstash (often 6379)
spring.data.redis.port=6379
# Copy the long alphanumeric password token string from your Upstash cluster page
spring.data.redis.password=gQAAAAAAAp2cAAIgcDFlMThlYTY5MTU5N2M0NGE2OTI5MWQ1M2RkMDU1OTI3ZQ

# CRITICAL FOR UPSTASH: Enforces secure TLS connection to the cloud cluster
spring.data.redis.ssl.enabled=true

# 3. Cache Provider Activation
spring.cache.type=redis

# OPTIONAL LOGS
logging.level.org.springframework.cache=TRACE
logging.level.org.springframework.data.redis=DEBUG