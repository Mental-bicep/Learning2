spring.application.name=FlywayDemo
# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# CRITICAL: Stop Hibernate from auto-generating tables!
# "validate" means Hibernate will only check if the tables/columns exist, 
# ensuring Flyway did its job correctly.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Enable H2 Console to view our tables
spring.h2.console.enabled=true